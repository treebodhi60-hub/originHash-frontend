
name: OriginHash Frontend Deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: originhash-frontend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ghcr.io/vincikanth/originhash-client:master
            ghcr.io/vincikanth/originhash-client:sha-${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=/api

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy frontend to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: sha-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          SSH=(
            ssh
            -i "$HOME/.ssh/deploy_key"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
          )

          printf '%s' "$GHCR_TOKEN" | "${SSH[@]}" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e
             docker pull ghcr.io/vincikanth/originhash-client:${IMAGE_TAG}
             docker tag ghcr.io/vincikanth/originhash-client:${IMAGE_TAG} ghcr.io/vincikanth/originhash-client:master
             docker compose --env-file /root/.env -f /root/docker-compose.ghcr.yml up -d --no-deps frontend
             for i in \$(seq 1 18); do
               status=\$(docker inspect --format='{{.State.Status}}' originhash_frontend)
               [ \"\$status\" = running ] && exit 0
               sleep 5
             done
             docker logs --tail 80 originhash_frontend
             exit 1"

      - name: Verify public frontend
        run: |
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 \
            --retry-all-errors \
            https://origin.originhash.com/
